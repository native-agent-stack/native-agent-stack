# SOURCE-ONLY, UNRUN. prometheus v3.15.0 documentation/examples/prometheus.yml:1,21-33.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:@PORT_ALERTMANAGER@"]
rule_files: [prometheus-alerts.yaml]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:@PORT_PROMETHEUS@"]
        labels:
          app: prometheus
    scrape_native_histograms: true
  - job_name: otel-native
    honor_labels: true
    static_configs:
      - targets: ["127.0.0.1:@PORT_OTEL_EXPORTER@"]
  - job_name: otel-collector
    static_configs:
      - targets: ["127.0.0.1:@PORT_OTEL_METRICS@"]
  # Kept empty outside explicitly selected native delivery acceptance.
  - job_name: acceptance-fixture
    scrape_interval: 5s
    file_sd_configs:
      - files: [acceptance-targets.json]
        refresh_interval: 5s
