# The stack's additions to ai-memory 3.1.0's systemd user unit. `ai-memory setup` writes and owns the unit
# (akitaonrails/ai-memory@11ca7c5b crates/ai-memory-cli/src/commands/user_service.rs:51-55 and 193-234), so the
# additions live in this drop-in and the unit keeps one writer (the CC's ruling D2 for PR (b) condition 4, 2026-10-17).
# systemd merges ai-memory.service.d/*.conf after the unit (systemd v259 man/systemd.unit.xml:203-207).
# CPUWeight=idle: man/systemd.resource-control.xml:187-209 at v259; MemoryMax=: :406 at v259. PATH follows the plan's
# other user units (config/dagu.service).
# PROVISIONAL: MemoryMax=4G is a labelled provisional bound (the CC's ruling G5, 2026-10-17), not a measured one.
# Before this lands, ai-memory's peak RSS under the acceptance load is measured, with this row's in-process local
# embedder, and cited, and the bound is then set from that measurement. The only reading so far is NativeHorizonNY's
# 3.1.0 service at 151678976 bytes (systemctl --user show -p MemoryPeak, 2026-10-17T01:15:00Z) with a remote embedder,
# which supports no bound for this row.
[Service]
Environment=PATH=%h/.local/bin:/usr/local/bin:/usr/bin:/bin
CPUWeight=idle
MemoryMax=4G
