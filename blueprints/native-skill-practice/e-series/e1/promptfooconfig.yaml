# E1, code navigation under worktree-per-task, as a promptfoo config: arms A0a, A0b, A1, A3 and A5 of the preregistered design.
#
# Needs promptfoo >= 0.124.0 (copy_working_dir: promptfoo/promptfoo@30949931ee90, src/providers/agentWorkspace.ts) and @anthropic-ai/claude-agent-sdk 0.3.283 resolvable from this file's directory
# (the provider imports it from the config's directory). Run it staged, not from the repository: e1_prepare.py copies this directory to <root>/config, links or installs the SDK there and builds the trees;
# e1_run.py starts promptfoo with the environment this file expects (README.md of the parent folder).
#
# Every {{ env.* }} below is set by e1_run.py: E1_ROOT (the prepared root), E1_CLAUDE (the versioned client binary, 2.1.296) and E1_SEMBLE_MODEL (the local semble model directory).
# The arms with a hook (A2n, A2v) or alwaysLoad (A4) stay in the private runner: the provider's structured MCP option carries type, command, args and env only (src/providers/mcp/transform.ts L205-L225),
# and command hooks were not run through the provider. The client's init record is not part of the provider's response, so the `preflight` row below tells the servers and the directive from a silent null.
description: E1 code navigation under worktree-per-task (arms A0a, A0b, A1, A3, A5)

evaluateOptions:
  maxConcurrency: 1
  cache: false

# The values every arm shares. The private runner started `claude -p` with the same model, effort, tool fence, permission mode, setting source, structured answer and environment.
# setting_sources is local only, as in the runner: under it neither the project's CLAUDE.md nor the user-level one is loaded, so a directive travels in CLAUDE.local.md, which the local source does load.
x-arm-fence: &fence
  model: claude-opus-5-5
  effort: medium
  permission_mode: dontAsk
  tools: [Bash, Read, Glob, Grep, ToolSearch]
  custom_allowed_tools: []
  disallowed_tools: [Agent, Task, Workflow, ScheduleWakeup, Edit, Write, NotebookEdit, WebFetch, WebSearch]
  setting_sources: [local]
  settings: '{{ env.E1_ROOT }}/settings.json'
  strict_mcp_config: true
  max_budget_usd: 4
  output_format:
    type: json_schema
    schema:
      type: object
      properties:
        answer: {type: string}
        citations:
          type: array
          items:
            type: object
            properties:
              file: {type: string}
              line: {type: integer}
            required: [file, line]
        functions:
          type: array
          items: {type: string}
      required: [answer, citations]
  path_to_claude_code_executable: '{{ env.E1_CLAUDE }}'
  copy_working_dir: copy
  env:
    CLAUDE_CODE_TMPDIR: '{{ env.E1_ROOT }}/claude-tmp'
    MCP_TIMEOUT: '120000'
    CLAUDE_CODE_ENABLE_TELEMETRY: '0'
    DISABLE_TELEMETRY: '1'
    ENABLE_CLAUDEAI_MCP_SERVERS: 'false'

# The four code-navigation servers of every arm except A5.
x-servers: &servers
  enabled: true
  servers:
    - name: serena
      command: serena
      args: [start-mcp-server, --transport, stdio, --project-from-cwd, --context, claude-code, --enable-web-dashboard, 'false', --open-web-dashboard, 'false', --enable-gui-log-window, 'false']
    - name: semble
      command: semble
      env:
        SEMBLE_MODEL_NAME: '{{ env.E1_SEMBLE_MODEL }}'
        SEMBLE_CACHE_LOCATION: '{{ env.E1_ROOT }}/cache/semble'
    - name: codebase-memory-mcp
      command: codebase-memory-mcp
    - name: jcodemunch
      command: jcodemunch-mcp
      env:
        JCODEMUNCH_SHARE_SAVINGS: '0'
        CODE_INDEX_PATH: '{{ env.E1_ROOT }}/cache/code-index'

prompts:
  - label: worktree-start
    raw: |-
      The repository for this task is the current directory (a checkout of one commit). Answer the question about this checkout only.

      Question: {{ question }}
  # The session starts in a stale copy; the task names the worktree. promptfoo creates the session directory per call, so the prompt cannot name it and says "the current one".
  - label: stale-start
    raw: |-
      The repository for this task is checked out at {{ env.E1_ROOT }}/trees/base (a worktree of one commit). Your session started in a different directory, the current one, which holds an older copy of the repository: answer about {{ env.E1_ROOT }}/trees/base only.

      Question: {{ question }}

providers:
  # A0a, the status quo: the session starts in a copy of the stale shared checkout; the worktree at the base commit is opened with --add-dir.
  - id: anthropic:claude-agent-sdk
    label: A0a
    prompts: [stale-start]
    config:
      <<: *fence
      working_dir: '{{ env.E1_ROOT }}/trees/stale'
      additional_directories: ['{{ env.E1_ROOT }}/trees/base']
      mcp: *servers
  # A0b: the session starts in the worktree at the base commit (the vendor-documented launch).
  - id: anthropic:claude-agent-sdk
    label: A0b
    prompts: [worktree-start]
    config:
      <<: *fence
      working_dir: '{{ env.E1_ROOT }}/trees/base'
      mcp: *servers
  # A1: A0b plus the "Code navigation" paragraph that names the Serena tools, in the tree's CLAUDE.local.md (directives/serena.md).
  - id: anthropic:claude-agent-sdk
    label: A1
    prompts: [worktree-start]
    config:
      <<: *fence
      working_dir: '{{ env.E1_ROOT }}/trees/base-serena'
      mcp: *servers
  # A3: A0a plus the paragraph that names the path-per-call tools (directives/path.md).
  - id: anthropic:claude-agent-sdk
    label: A3
    prompts: [stale-start]
    config:
      <<: *fence
      working_dir: '{{ env.E1_ROOT }}/trees/stale-path'
      additional_directories: ['{{ env.E1_ROOT }}/trees/base']
      mcp: *servers
  # A5: A0b with no code-navigation server (the cost and correctness reference; not an adoption candidate).
  - id: anthropic:claude-agent-sdk
    label: A5
    prompts: [worktree-start]
    config:
      <<: *fence
      working_dir: '{{ env.E1_ROOT }}/trees/base'

tests:
  - path: file://e1_tests.py:create_tests
    config:
      repeats: 3
