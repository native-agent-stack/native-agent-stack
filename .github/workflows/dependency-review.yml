name: Dependency review

# Required PR dependency review (main-ruleset.json lists `dependency-review`):
# fails on a newly introduced dependency with a high or critical advisory. It
# needs the repository's dependency graph enabled. Like every ubuntu job that is
# not byte-pinned by retained evidence, it starts with harden-runner in audit
# mode (tests/test_workflow_hardening.py). The warn-only phase and its end are
# recorded in docs/decisions/2026-09-22-actions-hardening.md and
# docs/decisions/2026-09-22-github-automation-closure.md.

on:
  merge_group:
    types: [checks_requested]
  pull_request:

# No token scope and no cache access by default; each job grants its own (docs/decisions/2026-10-04-ci-least-privilege.md).
permissions: {}
cache-mode: none

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes (fails on high or critical advisories)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # v5 action.yml requires explicit refs outside pull_request events.
          base-ref: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
