name: OpenSSF Scorecard (report-only)

# Report-only supply-chain scorecard: publish_results is false (no publication
# to the public api.scorecard.dev dataset or badge). Results go to code
# scanning through github/codeql-action/upload-sarif (the analysis job alone
# holds security-events: write) and stay a workflow artifact; a low check score
# never fails the job. See docs/decisions/2026-09-22-actions-hardening.md and
# docs/decisions/2026-09-22-github-automation-closure.md for the evidence and scope.

on:
  schedule:
    - cron: '13 5 * * 1' # Weekly Monday 05:13 UTC
  push:
    branches: [main]
  workflow_dispatch:

# No token scope by default; the analysis job grants its own (docs/decisions/2026-10-04-ci-least-privilege.md).
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the Scorecard SARIF to code scanning; this job only
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard (no publish)
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard SARIF as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results-${{ github.run_id }}
          path: results.sarif
          if-no-files-found: error
          retention-days: 5
      - name: Upload Scorecard SARIF to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
