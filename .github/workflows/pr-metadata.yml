name: PR metadata gates

on:
  push:
    branches: [main]
  pull_request:
    # Description edits and retargets re-run only the metadata gates, using the current PR.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions: {}
cache-mode: none

# Queue edits without replacing a pending run; API reads make freshness independent of queue order.
# github/docs@336b7f546d94, data/reusables/actions/actions-group-concurrency.md.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  queue: max

jobs:
  verdict-review-gate:
    # Required check (docs/decisions/2026-09-22-github-automation-closure.md, "verdict-review-gate
    # (2026-09-23)"): with one maintainer and zero required approvals, a PR that changes a
    # layer-verdict row merges only when the row is consistent with the sealed cross-family lane
    # returns its wave registers (the returns are self-attested; see the record's residual). It has
    # no path filter so it reports on every pull request and can be required.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
        # Full history: the gate reads the base commit's ledger and wave registry with git show.
      - name: Require the current PR base to match this event
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {data: pullRequest} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const eventBase = context.payload.pull_request.base;
            if (pullRequest.base.ref !== eventBase.ref) {
              core.setFailed('verdict-review-gate: the current PR base differs from the event base; failing closed (push a commit or close and reopen the pull request to rebuild its merge commit).');
            }
      - name: Require sealed cross-family review for changed verdict rows
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          # The pull request's base branch (GITHUB_BASE_REF): the gate judges only pull requests into main.
          PR_BASE_REF: ${{ github.base_ref }}
          # Cross-check only: the base is the checked-out merge commit's first parent.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The checked-out HEAD must be the merge commit whose second parent is this PR head.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The pushed range's previous commit on main.
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              # A pull request into another branch is not judged against main, and retargeting it to
              # main later re-runs this job (the edited type): fail closed rather than pass a base the
              # gate does not protect.
              if [ "${PR_BASE_REF:-}" != "main" ]; then
                echo "::error::verdict-review-gate: the pull request's base branch is '${PR_BASE_REF:-}', not main; the gate judges only pull requests into main (retarget it to main); failing closed"
                exit 1
              fi
              # actions/checkout checks out the PR merge commit; its first parent is the base-branch
              # commit the PR is merged into, which is what the gate must compare with. Assert that
              # premise: HEAD has exactly two parents and the second is the payload's PR head, or
              # HEAD^1 could be the PR's own previous commit and the gate would judge only the last one.
              second_parent="$(git rev-parse --verify --quiet 'HEAD^2^{commit}' || true)"
              if [ -z "${PR_HEAD_SHA:-}" ] || [ "$second_parent" != "$PR_HEAD_SHA" ] \
                || git rev-parse --verify --quiet 'HEAD^3^{commit}' >/dev/null; then
                echo "::error::verdict-review-gate: HEAD is not the merge commit of the PR head '${PR_HEAD_SHA:-}' (second parent '$second_parent'); failing closed"
                exit 1
              fi
              first_parent="$(git rev-parse --verify --quiet 'HEAD^1^{commit}' || true)"
              payload="${PR_BASE_SHA:-}"
              if [ -n "$first_parent" ] && [ -n "$payload" ]; then
                if ! git merge-base --is-ancestor "$payload" "$first_parent"; then
                  echo "::error::verdict-review-gate: the payload base $payload is not an ancestor of the merge commit's first parent $first_parent"
                  exit 1
                fi
                base="$first_parent"
              elif [ -n "$first_parent" ]; then
                base="$first_parent"
              elif [ -n "$payload" ]; then
                base="$payload"
              else
                echo "::error::verdict-review-gate: neither the merge commit's first parent nor the payload base is available"
                exit 1
              fi
              # The base must be a commit on main itself (full history fetches origin/main), not a
              # branch that merely contains main's tip, such as a merge commit left built against an
              # earlier base: a retargeted PR is otherwise judged against the branch it left.
              if ! git merge-base --is-ancestor "$base" "refs/remotes/origin/$PR_BASE_REF"; then
                echo "::error::verdict-review-gate: the base $base is not a commit on origin/$PR_BASE_REF; failing closed (after a retarget the edited run checks out the merge commit built on the old base: close and reopen the pull request, or push a commit, to rebuild it on $PR_BASE_REF)"
                exit 1
              fi
              ;;
            push)
              base="${PUSH_BEFORE_SHA:-}"
              # A branch-creating push has an all-zero before: there is no base to judge against.
              if [ -z "$base" ] || [ -z "${base//0/}" ]; then
                echo "::error::verdict-review-gate: the push has no previous commit (before is '$base'); failing closed"
                exit 1
              fi
              ;;
            *)
              # workflow_dispatch has no base in its payload: compare with the parent.
              base="$(git rev-parse --verify 'HEAD^1^{commit}')"
              ;;
          esac
          # The rules come from the base: run the base commit's gate (and the code it imports) against
          # this checkout, so a pull request cannot weaken the gate that judges it. Only the pull
          # request that adds the gate (git diff reports it as A against the base) finds none at its
          # base and runs its own copy; any other base without the gate fails closed.
          gate="scripts/verdict_review_gate.py"
          if git cat-file -e "$base:$gate" 2>/dev/null; then
            git worktree add --quiet --detach "$RUNNER_TEMP/gate-base" "$base"
            gate="$RUNNER_TEMP/gate-base/$gate"
          else
            added="$(git diff --no-renames --name-status -z "$base...HEAD" -- "$gate" | tr '\0' '\n')"
            if [ "$added" != $'A\n'"$gate" ]; then
              echo "::error::verdict-review-gate: the base $base has no $gate and this change does not add it; failing closed"
              exit 1
            fi
            echo "verdict-review-gate: this change adds the gate; running this checkout's copy (bootstrap)"
          fi
          python3 "$gate" --root "$GITHUB_WORKSPACE" --base "$base" | tee -a "$GITHUB_STEP_SUMMARY"

  sota-sources:
    # Top rule (AGENTS.md): every change names the maintained repository or published reference it
    # installs or follows. This job fails a PR whose description lacks a non-empty "SOTA sources" section
    # (## or ###). It reads the current body through the official actions/github-script
    # (github.com/actions/github-script, v9.0.0; docs.github.com/en/rest/pulls/pulls#get-a-pull-request).
    # A retrieval error fails the action; no body text reaches a shell.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Require a non-empty "SOTA sources" section in the PR description
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {data: pullRequest} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            // The body is judged before it is parsed: a non-text, malformed or overlong one fails with a fixed rule id and is
            // not read further. Tabs and line breaks pass, a line break being a paragraph separator (Bidi_Class B: LF,
            // CR, U+001C to U+001E and U+0085); #1003's mirror, tools/sota-sources/verify_sources.py, counts the last four
            // as section content, since its JS_TRIM leaves them. Every other C0 and C1 control is refused. The rules also
            // read a projection without them (below), so an admitted character cannot split a value.
            // The length bound is the gate's own, in code points. GitHub's REST update keeps a description of
            // at most 262,144 UTF-8 bytes (measured 2026-10-11), so no stored one reaches it; one here has carried 75,726 (#786).
            const MAX_BODY = 262144;
            const raw = pullRequest.body ?? '';
            const refused = typeof raw !== 'string' ? 'body-type'
              : [...raw].length > MAX_BODY ? 'body-size'
              : !raw.isWellFormed() ? 'body-encoding'
              : /[\u0000-\u0008\u000B\u000C\u000E-\u001B\u001F\u007F-\u0084\u0086-\u009F]/.test(raw) ? 'body-control' : null;
            if (refused) {
              core.setFailed(`The PR description cannot be checked (rule: ${refused}): it must be text of at most ${MAX_BODY} characters, with no control characters other than tabs and line breaks.`);
              return;
            }
            const body = raw;
            const match = body.match(/^#{2,3}[ \t]+SOTA sources[ \t]*$([\s\S]*?)(?=^#{2,3}[ \t]|(?![\s\S]))/m);
            const content = match ? match[1].replace(/<!--[\s\S]*?-->/g, '').trim() : '';
            // privacy-rules-begin
            // Privacy (correction #145): the home-path and credential rules of scripts/validate.py's PRIVATE_CONTENT in
            // JavaScript (tests/test_sota_sources_gate.py checks each against its Python original, over every code point). Python's
            // str patterns use Unicode classes, and JavaScript's \w, \b and \s differ even with the u flag, so each is spelled out
            // (Python 3.13 re docs): \w is a letter (L), a number (Nd, Nl, No) or '_'; \s is str.isspace(); $ also matches before
            // a final newline; under re.IGNORECASE [A-Za-z] also matches U+0130, U+0131, U+017F and U+212A, and 's' matches U+017F.
            // No rule takes the i flag: JavaScript's case folding under u puts U+0345 in \p{L}, which Python's \w excludes.
            const W = String.raw`\p{L}\p{Nd}\p{Nl}\p{No}_`;
            const w = `[${W}]`;
            const b = `(?:(?<=${w})(?!${w})|(?<!${w})(?=${w}))`;
            const S = String.raw`\t\n\v\f\r\x1C-\x20\x85\xA0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000`;
            const AZ = String.raw`A-Za-z\u0130\u0131\u017F\u212A`;
            const s17f = String.raw`[Ss\u017F]`;
            const end = String.raw`(?=\n?(?![\s\S]))`;
            const rule = (source, flags = '') => new RegExp(source, `u${flags}`);
            const users = `[Uu]${s17f}[Ee][Rr]${s17f}`;
            const example = '[Ee][Xx][Aa][Mm][Pp][Ll][Ee]';
            const privacy = [
              // A WSL distribution's home is read through its Windows UNC path too: \\wsl$\, \\wsl\ or \\wsl.localhost\, also after
              // \\?\UNC\ or \\.\UNC\, then <distro>\home\<name> or <distro>\mnt\<drive>\Users\<name>, in either slash, the prefix in any
              // case and JSON-escaped (scripts/validate.py cites the WSL and .NET path docs).
              ['personal-home-path', rule(String.raw`\/(?:home|Users)\/(?!example(?:\/|${b}))[A-Za-z0-9_.\-]+(?:\/|${b})|[\\\/]{2,4}(?:[?.][\\\/]{1,2}[Uu][Nn][Cc][\\\/]{1,2})?[Ww][Ss][Ll](?:\.[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]|\$)?[\\\/]{1,2}[^\\\/\r\n]{1,255}[\\\/]{1,2}(?:home|mnt[\\\/]{1,2}[A-Za-z][\\\/]{1,2}[Uu][Ss][Ee][Rr][Ss])[\\\/]{1,2}(?!example(?:[\\\/]|${b}))[A-Za-z0-9_.\-]+(?:[\\\/]|${b})`)],
              ['windows-user-path', rule(String.raw`(?:[${AZ}]:[\/\\]+|\/[Mm][Nn][Tt]\/[${AZ}]\/)${users}[\/\\]+(?!${example}(?:[\/\\]|${b}))[${AZ}0-9_.\-]+`)],
              // The graph-id form (home-<name>-code-, no leading dash) is read everywhere, as in validate.py: the code-host URL
              // exemption of earlier heads let an encoded home through in two rounds of reads, so it is gone.
              ['encoded-home-path', rule(String.raw`(?<![${W}\-])(?:-home-|-${users}-|[${AZ}]--${users}-|-[Mm][Nn][Tt]-[${AZ}]-${users}-)(?!example(?:-|[\/\\"'${S}\x60)\]]|${end}))[A-Za-z0-9_.]+(?:-|(?=[\/\\"'${S}\x60)\]]|${end}))|(?<![\p{L}\p{Nd}\p{Nl}\p{No}])home-(?!example-code-)[${W}.][${W}.\-]{0,255}-code-`)],
              ['hugging-face-token', rule(String.raw`${b}hf_[A-Za-z0-9]{20,}${b}`)],
              ['github-token', rule(String.raw`${b}(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,})${b}`)],
              ['tavily-token', rule(String.raw`${b}tvly-(?:(?:prod|dev)-)?[A-Za-z0-9_\-]{24,}${b}`)],
              ['api-secret', rule(String.raw`${b}sk-(?:proj-|ant-)?[A-Za-z0-9_\-]{24,}${b}`)],
              ['private-key', rule(String.raw`-----BEGIN[ A-Z0-9_\-]{0,100}PRIVATE KEY(?: BLOCK)?-----`)],
              ['bearer-credential', rule(String.raw`${b}[Bb][Ee][Aa][Rr][Ee][Rr][${S}]+[${AZ}0-9._~\-]{30,}`)],
              // Only here: a macOS home in any case at the start of a path (macOS volumes are case-insensitive by default),
              // however many slashes begin it (POSIX resolves three or more as one). validate.py keeps the exact /Users/
              // because API routes in tracked evidence spell /users/ the same way.
              ['macos-user-path', rule(String.raw`(?<![${W}.~\/\-])\/+(?!Users\/)[Uu][Ss][Ee][Rr][Ss]\/(?!example(?:\/|${b}))[A-Za-z0-9_.\-]+`)],
            ];
            // privacy-rules-end
            // Each decoder below undoes one way of writing text, so a home path or credential is caught as written and as it
            // reads: percent escapes, JSON escapes, HTML character references, and Markdown's rendered text (the body itself
            // keeps link destinations). Emphasis goes only in pairs around a word without a separator in it, so a glob such as
            // Users/*/ keeps its star.
            const fromCode = (code) => (code <= 0x10FFFF && !(code >= 0xD800 && code <= 0xDFFF) ? String.fromCodePoint(code) : '');
            const named = new Map([['amp', '&'], ['lt', '<'], ['gt', '>'], ['quot', '"'], ['apos', "'"], ['sol', '/'],
              ['bsol', '\\'], ['colon', ':'], ['period', '.'], ['lowbar', '_'], ['hyphen', '-'], ['dash', '-'], ['tilde', '~'],
              ['nbsp', '\u00A0'], ['Tab', '\t'], ['NewLine', '\n']]);
            const percentRun = (run) => {
              try { return decodeURIComponent(run); } catch { return run.replace(/%([0-9A-Fa-f]{2})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16))); }
            };
            // A link label holds no '[', so an unmatched '[' is passed over once, not rescanned to the end of the body. Its
            // parentheses hold no line break and one level of nested pairs, read by runs that cannot overlap, so an
            // unclosed '(' is scanned once to the end of its line.
            const links = /!?\[([^\[\]\n]*)\]\([^()\n]*(?:\([^()\n]*\)[^()\n]*)*\)/g;
            // CommonMark's own link shape, read too: a destination, whitespace (a line break among it) and an optional
            // quoted or parenthesized title. Each whitespace run is taken whole ((?=(\s*))\N), so no split of a run is retried.
            const titled = /!?\[([^\[\]\n]*)\]\((?=(\s*))\2<?[^\s()<>]*>?(?=(\s*))\3(?:(?:"[^"\n]*"|'[^'\n]*'|\([^()\n]*\))(?=(\s*))\4)?\)/g;
            // Only the inline elements GitHub renders are removed; any other <word>, such as a <user> placeholder, stays as text.
            const inlineTags = /<\/?(?:a|abbr|b|bdi|bdo|br|cite|code|del|dfn|em|i|img|ins|kbd|mark|q|rp|rt|ruby|s|samp|small|span|strike|strong|sub|sup|time|tt|u|var|wbr)\b[^<>\n]*>/gi;
            const decoders = [
              (text) => text.replace(/(?:%[0-9A-Fa-f]{2})+/g, percentRun),
              (text) => text.replace(/\\u([0-9A-Fa-f]{4})|\\\//g, (_, hex) => (hex ? String.fromCharCode(parseInt(hex, 16)) : '/')),
              (text) => text.replace(/&(?:#([0-9]{1,7})|#[xX]([0-9A-Fa-f]{1,6})|([A-Za-z]{2,8}));/g,
                (whole, decimal, hex, name) => (decimal ? fromCode(Number(decimal)) : hex ? fromCode(parseInt(hex, 16)) : named.get(name) ?? whole)),
              (text) => text.replace(links, '$1').replace(titled, '$1').replace(/!?\[([^\[\]\n]*)\]\[[^\[\]\n]*\]/g, '$1').replace(/<((?:https?|file|mailto):[^<>\s]*)>/g, '$1')
                .replace(inlineTags, '').replace(/\\([!-\/:-@\[-`{-~])/g, '$1').replace(/`/g, '')
                .replace(/(\*{1,3}|~{1,2}|_{1,3})([\p{L}\p{N}][^\s*~_\/\\]*?)\1/gu, '$2'),
            ];
            // The rules read the body as written and a projection of it for reading (the command center's ruling at
            // 752d9618, rule 4): HTML comments removed, as GitHub hides them (CommonMark 0.31.2, spec.txt:8986: <!-->,
            // <!---> or <!-- up to -->, found by one linear scan), and every character of general category Cc, Cf, Zl or
            // Zp but tab, LF and CR removed (234 code points in Unicode 17.0, which Node 24.21 carries, as in Python
            // 3.13.16's 15.1). A value split by a comment, a zero-width or bidi format character or an admitted line
            // break is read joined.
            const withoutComments = (text) => {
              let out = '';
              let at = 0;
              for (let open = text.indexOf('<!--'); open >= 0; open = text.indexOf('<!--', at)) {
                const close = text.indexOf('-->', open + 2);
                if (close < 0) break;
                out += text.slice(at, open);
                at = close + 3;
              }
              return out + text.slice(at);
            };
            const project = (text) => withoutComments(text).replace(/(?![\t\n\r])[\p{Cc}\p{Cf}\p{Zl}\p{Zp}]/gu, '');
            // The decoders compose: the rules see the body and its projection after every order of every subset of them,
            // each decoder at most once along a chain and never to a fixed point (up to 65 forms from each), so a value
            // written with several of these at once, such as character references around emphasis, is judged as it reads
            // too. In the projection's chains each decoder's output is projected again, so a reference that decodes to a
            // comment or a format character is removed as well.
            const forms = new Set();
            const compose = (text, rest, then) => {
              forms.add(text);
              rest.forEach((decoder, index) => compose(then(decoder(text)), rest.filter((_, other) => other !== index), then));
            };
            compose(body, decoders, (text) => text);
            compose(project(body), decoders, project);
            const hits = privacy.filter(([, pattern]) => [...forms].some((form) => pattern.test(form))).map(([id]) => id);
            const problems = [];
            if (!content) {
              problems.push('The PR description needs a non-empty "SOTA sources" section: the repository, pin and file, or the published reference, behind each change (AGENTS.md top rule).');
            }
            if (hits.length) {
              problems.push(`The PR description carries private content (rules: ${hits.join(', ')}): write home paths as ~/ and never paste a credential.`);
            }
            if (problems.length) {
              core.setFailed(problems.join(' '));
            } else {
              core.info(`SOTA sources section present (${content.length} characters).`);
            }
