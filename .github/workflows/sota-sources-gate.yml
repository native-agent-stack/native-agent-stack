            const inlineTags = /<\/?(?:a|abbr|b|bdi|bdo|br|cite|code|del|dfn|em|i|img|ins|kbd|mark|q|rp|rt|ruby|s|samp|small|span|strike|strong|sub|sup|time|tt|u|var|wbr)\b[^<>\n]*>/gi;
            const decoders = [
              (text) => text.replace(/(?:%[0-9A-Fa-f]{2})+/g, percentRun),
              (text) => text.replace(/\\u([0-9A-Fa-f]{4})|\\\//g, (_, hex) => (hex ? String.fromCharCode(parseInt(hex, 16)) : '/')),
              (text) => text.replace(/&(?:#([0-9]{1,7})|#[xX]([0-9A-Fa-f]{1,6})|([A-Za-z][A-Za-z0-9]{1,31}));/g,
                (whole, decimal, hex, name) => (decimal ? fromCode(Number(decimal)) : hex ? fromCode(parseInt(hex, 16)) : named.get(name) ?? whole)),
              (text) => text.replace(links, '$1').replace(titled, '$1').replace(/!?\[([^\[\]\n]*)\]\[[^\[\]\n]*\]/g, '$1').replace(/<((?:https?|file|mailto):[^<>\s]*)>/g, '$1')
                .replace(inlineTags, '').replace(/\\([!-\/:-@\[-`{-~])/g, '$1').replace(/`/g, '')
                .replace(/(\*{1,3}|~{1,2}|_{1,3})([\p{L}\p{N}][^\s*~_\/\\]*?)\1/gu, '$2'),
            ];
            // The rules read the body as written and a projection of it for reading (the command center's rulings at
            // 752d9618 and e15d1259, rule 4: each set is the one a specification defines, not a list). The projection
            // removes every raw-HTML construct of the GFM grammar (github/cmark-gfm@587a12bb test/spec.txt:9360-9431, "Raw
            // HTML": an open tag, a closing tag, a comment, a processing instruction, a declaration and a CDATA section), as
            // GitHub drops them, by one linear scan; a construct that stands alone between separators (whitespace, a slash
            // or a backslash, or either end), such as a <user> placeholder in a path, is kept, since removing it would join
            // the separators around it. It then removes every character of general category Cc, Cf, Zl or Zp but tab, LF
            // and CR, and every Default_Ignorable_Code_Point (UCD DerivedCoreProperties.txt; Unicode 17.0 in Node 24.21),
            // and applies NFKC, which folds width forms such as a fullwidth solidus. A value spelled with its own characters
            // is read joined, whatever is inserted between them; a look-alike that substitutes a character is not.
            const tagAt = /<[A-Za-z][A-Za-z0-9-]*(?:\s+[A-Za-z_:][A-Za-z0-9_.:-]*(?:\s*=\s*(?:[^\s"'=<>`]+|'[^']*'|"[^"]*"))?)*\s*\/?>|<\/[A-Za-z][A-Za-z0-9-]*\s*>/y;
            const markupEnd = (text, open) => {
              const closer = (start, close) => {
                const at = text.indexOf(close, start);
                return at < 0 ? -1 : at + close.length;
              };
              if (text.startsWith('<!--', open)) return closer(open + 2, '-->');
              if (text.startsWith('<?', open)) return closer(open + 2, '?>');
              if (text.startsWith('<![CDATA[', open)) return closer(open + 9, ']]>');
              if (/^<![A-Za-z]/.test(text.slice(open, open + 3))) return closer(open + 2, '>');
              tagAt.lastIndex = open;
              const match = tagAt.exec(text);
              return match ? open + match[0].length : -1;
            };
            const separator = (character) => character === undefined || /[\s\/\\]/.test(character);
            const withoutMarkup = (text) => {
              let out = '';
              let at = 0;
              const unclosed = new Set();
              for (let open = text.indexOf('<'); open >= 0; open = text.indexOf('<', open + 1)) {
                // A backslash-escaped '<' is text (CommonMark's backslash escapes): count the backslashes before it.
                let slashes = 0;
                while (text[open - 1 - slashes] === '\\') slashes += 1;
                if (slashes % 2) continue;
                // Once a closer is missing after one opening, it is missing after every later one: skip them.
                const kind = text.startsWith('<!--', open) ? '-->' : text.startsWith('<?', open) ? '?>'
                  : text.startsWith('<![CDATA[', open) ? ']]>' : /^<![A-Za-z]/.test(text.slice(open, open + 3)) ? '>' : null;
                if (kind && unclosed.has(kind)) continue;
                const end = markupEnd(text, open);
                if (end < 0) {
                  if (kind) unclosed.add(kind);
                  continue;
                }
                if (!(separator(text[open - 1]) && separator(text[end]))) {
                  out += text.slice(at, open);
                  at = end;
                }
                open = end - 1;
              }
              return out + text.slice(at);
            };
            const projectCharacters = (text) => text
              .replace(/(?![\t\n\r])[\p{Cc}\p{Cf}\p{Zl}\p{Zp}\p{Default_Ignorable_Code_Point}]/gu, '').normalize('NFKC');
            // Markup is removed from the body as written only: GitHub parses raw HTML there, never in what a reference,
            // an escape or Markdown decodes to, so the projection's decoder chains apply the character projection alone.
            const project = (text) => projectCharacters(withoutMarkup(text));
            // The decoders compose: the rules see the body and its projection after every order of every subset of them,
            // each decoder at most once along a chain and never to a fixed point (up to 65 forms from each), so a value
            // written with several of these at once, such as character references around emphasis, is judged as it reads
            // too. In the projection's chains each decoder's output is projected again, so a reference that decodes to a
            // format character or a width form is read as that character too.
            const forms = new Set();
            const compose = (text, rest, then) => {
              forms.add(text);
              rest.forEach((decoder, index) => compose(then(decoder(text)), rest.filter((_, other) => other !== index), then));
            };
            compose(body, decoders, (text) => text);
            compose(project(body), decoders, projectCharacters);
            const hits = privacy.filter(([, pattern]) => [...forms].some((form) => pattern.test(form))).map(([id]) => id);
            const problems = [];
            if (!content) {
              problems.push('The PR description needs a non-empty "SOTA sources" section: the repository, pin and file, or the published reference, behind each change (AGENTS.md top rule).');
            }
            if (hits.length) {
              problems.push(`The PR description carries private content (rules: ${hits.join(', ')}): write home paths as ~/ and never paste a credential.`);
            }
            if (problems.length) {
              core.setFailed(problems.join(' '));
            } else {
              core.info(`SOTA sources section present (${content.length} characters).`);
            }
