name: SOTA sources gate

# The reusable form of pr-metadata.yml's required sota-sources job, for other repositories: the new-repository scaffold's
# .github/workflows/sota-sources.yml (adoption/scaffold/, written by tools/adoption/scaffold_repo.py) calls this file at
# a pinned commit of this repository's main. From its `if:` line on, the job below is pr-metadata.yml's job byte for byte
# (tests/test_sota_sources_gate.py); change both together. pr-metadata.yml keeps its own copy because .github/
# main-ruleset.json requires that job's check here. A called workflow runs in its caller's context, so
# github.event_name and the PR number are the caller's, and it can only reduce the caller's token
# permissions (docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations, "github
# context" and "Supported keywords for jobs that call a reusable workflow").

on:
  workflow_call:

# No default token scope and no cache access (docs/decisions/2026-10-04-ci-least-privilege.md). The job grants only
# pull-requests: read to fetch the current body; callers must grant it too and bump their commit pin to adopt this
# change. No concurrency group here: in a called workflow ${{ github.workflow }} is the caller's name.
permissions: {}
cache-mode: none

jobs:
  sota-sources:
    # Top rule: every change names the maintained repository or published reference it installs or follows. This job
    # fails a pull request whose description lacks a non-empty "SOTA sources" section (## or ###), reading the body
    # from the current PR through actions/github-script; a retrieval error fails the action and no body text reaches a shell.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - name: Harden the runner (audit-only network egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Require a non-empty "SOTA sources" section in the PR description
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {data: pullRequest} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            // The body is judged before it is parsed: a non-text, malformed or overlong one fails with a fixed rule id and is
            // not read further. The length bound is the gate's own, in code points. GitHub's REST update keeps a description of
            // at most 262,144 UTF-8 bytes (measured 2026-10-11), so no stored one reaches it; one here has carried 75,726 (#786).
            const MAX_BODY = 262144;
            const raw = pullRequest.body ?? '';
            const refused = typeof raw !== 'string' ? 'body-type'
              : [...raw].length > MAX_BODY ? 'body-size'
              : !raw.isWellFormed() ? 'body-encoding'
              : /[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F]/.test(raw) ? 'body-control' : null;
            if (refused) {
              core.setFailed(`The PR description cannot be checked (rule: ${refused}): it must be text of at most ${MAX_BODY} characters, with no control characters other than tabs and line breaks.`);
              return;
            }
            const body = raw;
            const match = body.match(/^#{2,3}[ \t]+SOTA sources[ \t]*$([\s\S]*?)(?=^#{2,3}[ \t]|(?![\s\S]))/m);
            const content = match ? match[1].replace(/<!--[\s\S]*?-->/g, '').trim() : '';
            // privacy-rules-begin
            // Privacy (correction #145): the home-path and credential rules of scripts/validate.py's PRIVATE_CONTENT in
            // JavaScript (tests/test_sota_sources_gate.py checks each against its Python original, over every code point). Python's
            // str patterns use Unicode classes, and JavaScript's \w, \b and \s differ even with the u flag, so each is spelled out
            // (Python 3.13 re docs): \w is a letter (L), a number (Nd, Nl, No) or '_'; \s is str.isspace(); $ also matches before
            // a final newline; under re.IGNORECASE [A-Za-z] also matches U+0130, U+0131, U+017F and U+212A, and 's' matches U+017F.
            // No rule takes the i flag: JavaScript's case folding under u puts U+0345 in \p{L}, which Python's \w excludes.
            const W = String.raw`\p{L}\p{Nd}\p{Nl}\p{No}_`;
            const w = `[${W}]`;
            const b = `(?:(?<=${w})(?!${w})|(?<!${w})(?=${w}))`;
            const S = String.raw`\t\n\v\f\r\x1C-\x20\x85\xA0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000`;
            const AZ = String.raw`A-Za-z\u0130\u0131\u017F\u212A`;
            const s17f = String.raw`[Ss\u017F]`;
            const end = String.raw`(?=\n?(?![\s\S]))`;
            const rule = (source, flags = '') => new RegExp(source, `u${flags}`);
            const users = `[Uu]${s17f}[Ee][Rr]${s17f}`;
            const example = '[Ee][Xx][Aa][Mm][Pp][Ll][Ee]';
            const privacy = [
              ['personal-home-path', rule(String.raw`\/(?:home|Users)\/(?!example(?:\/|${b}))[A-Za-z0-9_.\-]+(?:\/|${b})`)],
              ['windows-user-path', rule(String.raw`(?:[${AZ}]:[\/\\]+|\/[Mm][Nn][Tt]\/[${AZ}]\/)${users}[\/\\]+(?!${example}(?:[\/\\]|${b}))[${AZ}0-9_.\-]+`)],
              // Only here: the graph-id form (home-<name>-code-, no leading dash) is not read in a public code host's URL path,
              // within 256 characters of the host, where it names a repository: github.com/<owner>/home-<name>-code-review.
              // The hosts are listed in lower case, so a loopback, private or unlisted host is still read; the path stops at
              // : @ ? #, so userinfo and query strings are read too. The check runs only where home- occurs, so it stays linear.
              ['encoded-home-path', rule(String.raw`(?<![${W}\-])(?:-home-|-${users}-|[${AZ}]--${users}-|-[Mm][Nn][Tt]-[${AZ}]-${users}-)(?!example(?:-|[\/\\"'${S}\x60)\]]|${end}))[A-Za-z0-9_.]+(?:-|(?=[\/\\"'${S}\x60)\]]|${end}))|(?<![\p{L}\p{Nd}\p{Nl}\p{No}])home-(?<!https?:\/\/(?:[a-z0-9\-]{1,63}\.){0,4}(?:github\.com|githubusercontent\.com|gitlab\.com|bitbucket\.org|codeberg\.org|huggingface\.co|sr\.ht)\/[^${S}<>"'\x60:@?#]{0,256}home-)(?!example-code-)[${W}.][${W}.\-]{0,255}-code-`)],
              ['hugging-face-token', rule(String.raw`${b}hf_[A-Za-z0-9]{20,}${b}`)],
              ['github-token', rule(String.raw`${b}(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,})${b}`)],
              ['tavily-token', rule(String.raw`${b}tvly-(?:(?:prod|dev)-)?[A-Za-z0-9_\-]{24,}${b}`)],
              ['api-secret', rule(String.raw`${b}sk-(?:proj-|ant-)?[A-Za-z0-9_\-]{24,}${b}`)],
              ['private-key', rule(String.raw`-----BEGIN[ A-Z0-9_\-]{0,100}PRIVATE KEY(?: BLOCK)?-----`)],
              ['bearer-credential', rule(String.raw`${b}[Bb][Ee][Aa][Rr][Ee][Rr][${S}]+[${AZ}0-9._~\-]{30,}`)],
              // Only here: a macOS home in any case at the start of a path (macOS volumes are case-insensitive by default),
              // however many slashes begin it (POSIX resolves three or more as one). validate.py keeps the exact /Users/
              // because API routes in tracked evidence spell /users/ the same way.
              ['macos-user-path', rule(String.raw`(?<![${W}.~\/\-])\/+(?!Users\/)[Uu][Ss][Ee][Rr][Ss]\/(?!example(?:\/|${b}))[A-Za-z0-9_.\-]+`)],
            ];
            // privacy-rules-end
            // Each decoder below undoes one way of writing text, so a home path or credential is caught as written and as it
            // reads: percent escapes, JSON escapes, HTML character references, and Markdown's rendered text (the body itself
            // keeps link destinations). Emphasis goes only in pairs around a word without a separator in it, so a glob such as
            // Users/*/ keeps its star.
            const fromCode = (code) => (code <= 0x10FFFF && !(code >= 0xD800 && code <= 0xDFFF) ? String.fromCodePoint(code) : '');
            const named = new Map([['amp', '&'], ['lt', '<'], ['gt', '>'], ['quot', '"'], ['apos', "'"], ['sol', '/'],
              ['bsol', '\\'], ['colon', ':'], ['period', '.'], ['lowbar', '_'], ['hyphen', '-'], ['dash', '-'], ['tilde', '~'],
              ['nbsp', '\u00A0'], ['Tab', '\t'], ['NewLine', '\n']]);
            const percentRun = (run) => {
              try { return decodeURIComponent(run); } catch { return run.replace(/%([0-9A-Fa-f]{2})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16))); }
            };
            // A link label holds no '[', so an unmatched '[' is passed over once, not rescanned to the end of the body.
            const links = /!?\[([^\[\]\n]*)\]\(\s*<?([^\s()<>]*)>?(?:\s+(?:"[^"\n]*"|'[^'\n]*'|\([^()\n]*\)))?\s*\)/g;
            // Only the inline elements GitHub renders are removed; any other <word>, such as a <user> placeholder, stays as text.
            const inlineTags = /<\/?(?:a|abbr|b|bdi|bdo|br|cite|code|del|dfn|em|i|img|ins|kbd|mark|q|rp|rt|ruby|s|samp|small|span|strike|strong|sub|sup|time|tt|u|var|wbr)\b[^<>\n]*>/gi;
            const decoders = [
              (text) => text.replace(/(?:%[0-9A-Fa-f]{2})+/g, percentRun),
              (text) => text.replace(/\\u([0-9A-Fa-f]{4})|\\\//g, (_, hex) => (hex ? String.fromCharCode(parseInt(hex, 16)) : '/')),
              (text) => text.replace(/&(?:#([0-9]{1,7})|#[xX]([0-9A-Fa-f]{1,6})|([A-Za-z]{2,8}));/g,
                (whole, decimal, hex, name) => (decimal ? fromCode(Number(decimal)) : hex ? fromCode(parseInt(hex, 16)) : named.get(name) ?? whole)),
              (text) => text.replace(links, '$1').replace(/!?\[([^\[\]\n]*)\]\[[^\[\]\n]*\]/g, '$1').replace(/<((?:https?|file|mailto):[^<>\s]*)>/g, '$1')
                .replace(inlineTags, '').replace(/\\([!-\/:-@\[-`{-~])/g, '$1').replace(/`/g, '')
                .replace(/(\*{1,3}|~{1,2}|_{1,3})([\p{L}\p{N}][^\s*~_\/\\]*?)\1/gu, '$2'),
            ];
            // The decoders compose: the rules see the body after every order of every subset of them, each decoder at most
            // once along a chain and never to a fixed point (65 forms with the body), so a value written with several of
            // these at once, such as character references around emphasis, is judged as it reads too.
            const forms = new Set([body]);
            const compose = (text, rest) => rest.forEach((decoder, index) => {
              const next = decoder(text);
              forms.add(next);
              compose(next, rest.filter((_, other) => other !== index));
            });
            compose(body, decoders);
            const hits = privacy.filter(([, pattern]) => [...forms].some((form) => pattern.test(form))).map(([id]) => id);
            const problems = [];
            if (!content) {
              problems.push('The PR description needs a non-empty "SOTA sources" section: the repository, pin and file, or the published reference, behind each change (AGENTS.md top rule).');
            }
            if (hits.length) {
              problems.push(`The PR description carries private content (rules: ${hits.join(', ')}): write home paths as ~/ and never paste a credential.`);
            }
            if (problems.length) {
              core.setFailed(problems.join(' '));
            } else {
              core.info(`SOTA sources section present (${content.length} characters).`);
            }
