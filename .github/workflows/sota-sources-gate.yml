              "lsqb": "[", "lt": "<", "mfr": "\ud835\udd2a", "midast": "*", "mldr": "\u2026",
              "mopf": "\ud835\udd5e", "mscr": "\ud835\udcc2", "naturals": "\u2115", "nbsp": "\u00a0",
              "nfr": "\ud835\udd2b", "nldr": "\u2025", "nopf": "\ud835\udd5f", "nscr": "\ud835\udcc3", "num": "#",
              "numero": "\u2116", "numsp": "\u2007", "oS": "\u24c8", "ofr": "\ud835\udd2c", "oopf": "\ud835\udd60",
              "order": "\u2134", "orderof": "\u2134", "ordf": "\u00aa", "ordm": "\u00ba", "oscr": "\u2134",
              "percnt": "%", "period": ".", "pfr": "\ud835\udd2d", "phmmat": "\u2133", "planckh": "\u210e",
              "plus": "+", "popf": "\ud835\udd61", "primes": "\u2119", "pscr": "\ud835\udcc5", "puncsp": "\u2008",
              "qfr": "\ud835\udd2e", "qopf": "\ud835\udd62", "qscr": "\ud835\udcc6", "quaternions": "\u210d",
              "quest": "?", "quot": "\"", "rationals": "\u211a", "rbrace": "}", "rbrack": "]", "rcub": "}",
              "real": "\u211c", "realine": "\u211b", "realpart": "\u211c", "reals": "\u211d",
              "rfr": "\ud835\udd2f", "rlm": "\u200f", "ropf": "\ud835\udd63", "rpar": ")", "rscr": "\ud835\udcc7",
              "rsqb": "]", "semi": ";", "sfr": "\ud835\udd30", "shy": "\u00ad", "sol": "/", "sopf": "\ud835\udd64",
              "sscr": "\ud835\udcc8", "sup1": "\u00b9", "sup2": "\u00b2", "sup3": "\u00b3", "tfr": "\ud835\udd31",
              "thinsp": "\u2009", "topf": "\ud835\udd65", "trade": "\u2122", "tscr": "\ud835\udcc9",
              "ufr": "\ud835\udd32", "uopf": "\ud835\udd66", "uscr": "\ud835\udcca", "verbar": "|", "vert": "|",
              "vfr": "\ud835\udd33", "vopf": "\ud835\udd67", "vscr": "\ud835\udccb", "wfr": "\ud835\udd34",
              "wopf": "\ud835\udd68", "wscr": "\ud835\udccc", "xfr": "\ud835\udd35", "xopf": "\ud835\udd69",
              "xscr": "\ud835\udccd", "yfr": "\ud835\udd36", "yopf": "\ud835\udd6a", "yscr": "\ud835\udcce",
              "zeetrf": "\u2128", "zfr": "\ud835\udd37", "zopf": "\ud835\udd6b", "zscr": "\ud835\udccf",
              "zwj": "\u200d", "zwnj": "\u200c"
            }));
            // entities-end
            const percentRun = (run) => {
              try { return decodeURIComponent(run); } catch { return run.replace(/%([0-9A-Fa-f]{2})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16))); }
            };
            // A link label holds no '[', so an unmatched '[' is passed over once, not rescanned to the end of the body. Its
            // parentheses hold no line break and one level of nested pairs, read by runs that cannot overlap, so an
            // unclosed '(' is scanned once to the end of its line.
            const links = /!?\[([^\[\]\n]*)\]\([^()\n]*(?:\([^()\n]*\)[^()\n]*)*\)/g;
            // CommonMark's own link shape, read too: a destination, whitespace (a line break among it) and an optional
            // quoted or parenthesized title. Each whitespace run is taken whole ((?=(\s*))\N), so no split of a run is retried.
            const titled = /!?\[([^\[\]\n]*)\]\((?=(\s*))\2<?[^\s()<>]*>?(?=(\s*))\3(?:(?:"[^"\n]*"|'[^'\n]*'|\([^()\n]*\))(?=(\s*))\4)?\)/g;
